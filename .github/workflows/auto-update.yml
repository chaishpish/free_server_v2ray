name: Auto Update README Timestamp

on:
  schedule:
    # اجرا به صورت خودکار هر روز ساعت ۰۰:۰۰ به وقت UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # اعطای مجوز رسمی به ربات برای کامیت و پوش کردن تغییرات
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # آپدیت به نسخه ۴ برای رفع هشدار Node.js

      - name: Update Timestamp in README
        run: |
          # دریافت تاریخ و ساعت فعلی به وقت تهران
          CURRENT_TIME=$(TZ="Asia/Tehran" date +"%Y-%m-%d %H:%M")
          
          # اگر خط "آخرین به‌روزرسانی" وجود داشت، آن را جایگزین می‌کند
          if grep -q "🕒 آخرین به‌روزرسانی:" README.md; then
            sed -i "s/🕒 آخرین به‌روزرسانی: .*/🕒 آخرین به‌روزرسانی: $CURRENT_TIME/" README.md
          else
            # اگر وجود نداشت، به‌صورت ایمن به ابتدای فایل اضافه می‌کند
            echo "🕒 آخرین به‌روزرسانی: $CURRENT_TIME" | cat - README.md > temp && mv temp README.md
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          
          # فقط در صورتی کامیت و پوش می‌کند که واقعاً تغییری ایجاد شده باشد
          if git diff --staged --quiet; then
            echo "No changes to commit. Skipping."
          else
            git commit -m "chore: auto-update README timestamp [skip ci]"
            git push
          fi
